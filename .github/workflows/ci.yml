# coding_guideline.md section 16: every push and pull request passes these five steps.
name: CI

on:
  push:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    name: fmt, clippy, test
    # The app is a Windows desktop app (egui, Win32 resources); its tests need no display.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain of app/rust-toolchain.toml (with rustfmt and clippy).
      - name: Toolchain
        run: rustup show active-toolchain
      - name: cargo fmt --all --check
        run: cargo fmt --all --check
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace
        run: cargo test --workspace

  macos:
    name: macOS build, test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show active-toolchain
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace
        run: cargo test --workspace
      # The release packages for all platforms are built by release.yml.

  supply-chain:
    name: audit, deny
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit
        run: cargo audit
      - name: cargo deny check
        run: cargo deny check
