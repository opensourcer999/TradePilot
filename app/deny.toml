# cargo-deny (coding_guideline.md sections 14 and 16): licenses, advisories, bans and sources of
# every dependency. Run from this folder: `cargo deny check`.

[graph]
all-features = false

[advisories]
version = 2
# Known vulnerabilities fail the check; an unmaintained crate is reported for review.
yanked = "deny"
unmaintained = "workspace"
# Reviewed: chrono and chrono-tz are reported as unmaintained (no vulnerability, no successor with the same API) and
# are used for every date and time zone in the app. Revisit when the crates are replaced (jiff or time).
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained notice only, no vulnerability" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz: unmaintained notice only, no vulnerability" },
]

[licenses]
version = 2
# The licenses the dependency tree uses today (checked against the crates of Cargo.lock). A new
# license fails the check until it is reviewed and added here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # The fonts egui ships (epaint_default_fonts).
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
]
confidence-threshold = 0.8

[licenses.private]
# The crates of this workspace are not published (`publish = false`).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
